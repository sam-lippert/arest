[package]
name = "arest-host"
version = "0.1.0"
edition = "2021"

# THE MU IS A LIBRARY with three callers: the CLI (src/main.rs, src/bin/laws.rs), engine/os on bare UEFI,
# and a wasm module (src/wasm.rs). Lambda is READ at run time, as the Java, JS and C# hosts read it: from
# files on the CLI, from text embedded in the image on UEFI (feature "embedded"), from its loader on wasm.
# Compiling lambda as Rust source took minutes per edit and the golden never finished; reading it takes a
# second.
#
# The mu itself needs no crate. The platform's registrations do (feature "platform", the CLI's): SQLite,
# SHA-256, AES-GCM, base64 and entropy, as the other hosts take them from their runtimes. SQLite is the one
# rusqlite bundles, pinned near the Java host's sqlite-jdbc (3.47) so the hosts answer from the same engine.
[lib]
name = "arest_host"
path = "src/lib.rs"

[[bin]]
name = "arest-host"
path = "src/main.rs"
required-features = ["platform"]

[[bin]]
name = "arest-laws"
path = "src/laws.rs"
required-features = ["platform"]

[features]
default = ["platform"]
platform = ["dep:rusqlite", "dep:sha2", "dep:aes-gcm", "dep:base64", "dep:getrandom", "dep:mimalloc"]
embedded = []

[dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled"], optional = true }
sha2 = { version = "0.10", optional = true }
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.2", optional = true }
# the system allocator on Windows is slow for the many small values a mu makes; speed only
mimalloc = { version = "0.1", default-features = false, optional = true }

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1
debug = false
