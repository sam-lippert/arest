[package]
name = "arest-host"
version = "0.1.0"
edition = "2021"

# No dependencies, on purpose. A host is the registration vocabulary, a
# strict mu, the Backus base, and the six-line host contract — nothing that
# needs a crate. The sibling hosts (js host.js, java Arest.java, cs
# Mu.cs) carry no dependencies either; tools/rust-runner's `arest-proc` is a
# DIFFERENT artifact (the procedural projection, which uses rayon), not a mu.
[dependencies]

# THE MU IS A LIBRARY as well as a binary. engine/os asks the same canon
# through the same evaluator, and a second copy of a mu is how the first two
# js runners died -- so there is one, with two callers. src/main.rs is the
# CLI over it and nothing more; the six-line contract lives in the lib.
[lib]
name = "arest_host"
path = "src/lib.rs"

[[bin]]
name = "arest-host"
path = "src/main.rs"

[profile.release]
opt-level = 3

# The host is compared against three JIT'd hosts (bun, the JVM, .NET), so an
# unoptimized build is not a fair or useful comparison — but full release never
# finishes: LLVM cannot chew one ~1.7 MB include!d expression in reasonable
# time. opt-level 1 optimizes the mu and the base while leaving the giant canon
# body cheap to codegen; the whole point is that DEF calls are executed once at
# load, so nothing is lost by not optimizing them.
[profile.dev]
opt-level = 1
