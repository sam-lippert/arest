# CI for AREST — the 0.9.0 engine (engine/ is the codebase of record;
# the old crates/ + TS orchestration retired 2026-07-08, ledger entry
# "the old rust goes").
#
# THE WALL IS THE GATE. A law is a canon DEF the mu applies ("THE LAWS AS
# CANON", 2026-07-16: "a law written in a host IS the meaning-location
# failure"), so the verification of record is canon's own law:report
# evaluated over the composed store — not host test code. That gate had
# never run in CI; the `wall` leg below is it.
#
# The `python` and `rust` legs are HOST TEST CODE and are therefore
# scheduled for retirement, not extension. Each retires when its subject
# lands in canon and the wall covers it. Do not add cases to them; add a
# law to `law:report` in `arest` instead.
#
# STATION PARITY IS NOW A MEASUREMENT (2026-08-06). js, java and cs each
# evaluate all 53 laws over the base carriers and print BYTE-IDENTICAL
# atoms (md5 1219ce08..., 1664 bytes, exit 0; js 49.7s / java 29.7s /
# cs 80.1s). Previously java and cs ran >20 min without finishing: their
# heads lacked both of the js head's evaluator optimizations (the
# pure-application memo and FASTPRIMS' 14 compiled theta: cells). Controls
# on the js station proved each necessary and neither sufficient; both are
# now ported, and byte-identity is what certifies them as extensional
# equals rather than semantics.
#
# ONE blocker remains before the host suites can go: there is no rust
# station driving canon `main` (tools/rust-runner exists but is not wired
# to the wall), so `cargo test` has no canon-side replacement yet.
# Deleting the host suites before that holds would leave no verification.
#
# The frozen worker surface (src/, wrangler) is deliberately NOT built
# here: its wasm fed from the retired crates; the successor WASM path
# builds from engine/rust when that rung starts (see the ledger).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The canon gate: canon judges, the harness only drives. Every verdict
  # printed is a law's own atom, and the runner exits nonzero iff some
  # law answered F (tail.part.js: `process.exit(out[1] === "T" ? 0 : 1)`).
  wall:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # java (compose.py needs python) and dotnet are preinstalled on
      # windows-latest; a station that is missing prints SKIPPED, never a pass.
      - name: law:report on every station, held byte-identical
        shell: bash
        run: sh tools/wall/stations.sh

  python:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: engine fast suites
        working-directory: engine
        run: >
          python -m pytest
          tests/test_scheduler_canon.py tests/test_classify_canon.py
          tests/test_derive.py tests/test_rule_if.py
          tests/test_rule_anaphora.py tests/test_rule_negation.py
          tests/test_aggregates.py tests/test_derivation.py
          tests/test_skolem_prim.py tests/test_skolem_head.py
          tests/test_verb_parity.py tests/test_tutor_port.py
          tests/test_select_component.py tests/test_shared_scenarios.py
          -q

  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: resident test suites
        working-directory: engine/rust
        run: cargo test
