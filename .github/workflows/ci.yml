# CI for AREST — the 0.9.0 engine.
#
# THE WALL IS THE GATE. A law is a canon DEF the mu applies ("THE LAWS AS
# CANON", 2026-07-16: "a law written in a host IS the meaning-location
# failure"), so the verification of record is canon's own law:report
# evaluated over the composed store — not host test code.
#
# EACH HOST VERIFIES ITSELF, with its own toolchain and nothing else. They
# assert against engine/shared/expected-cases.tsv rather than against each
# other, so agreement is transitive through the golden and no host needs a
# second one installed. A station that is missing prints SKIPPED, never a
# pass.
#
# WHAT THIS FILE SAID BEFORE 2026-09-11, and why none of it could run. `delete
# the fat hosts` (8cc259ca, 08-29) removed tools/rust-station and the python
# suites, and this file was not read again, because it triggers on main alone
# and the work has been on a branch since. So of six steps:
#
#   wall / java host    FAILED  — test.sh handed javac a POSIX jar path
#   wall / rust host    FAILED  — tools/rust-station does not exist
#   python (whole job)  FAILED  — all 14 test files it names are gone;
#                                 engine/tests holds only __pycache__
#   rust (whole job)    FAILED  — engine/rust does not exist
#
# The js and cs steps were the only two that could pass. A gate describing a
# tree from August is not a gate, so this file now names what is here.
#
# THE GUI STATIONS ARE PART OF IT (Samuel, 2026-09-11: GUI runners should
# work). Neither was compiled by anything in this repo: test.sh built
# CasesTest alone, which reaches Arest and Reader and not Gui or Program, and
# tools/wpf-runner appeared in no step at all. They both build today, but that
# was a fact about the last person to run javac by hand. The java leg now
# compiles every source in the runner, and the wpf container has a step of its
# own — conditional, because it links iFactr.Wpf, iFactr.UI and MonoCross from
# the iFactr-WPF repo BESIDE this one, which a CI checkout does not have.
#
# THE RUST STATION IS OWED, not quietly dropped. tools/rust-host is
# tools/rust-station's successor and carries the tests
# (every_case_answers_what_the_canon_says, the 19-refusal golden,
# law_report_holds_byte_for_byte), but canon is compiled INTO it as rust
# source and is 87% of the build: after a canon edit `cargo test --no-run` did
# not finish in 560 s here (2026-09-11), and law_report_holds_byte_for_byte is
# the open subject of the rust mu having none of the js host's strategies. A
# leg that cannot be run is not a gate, so it returns when that build and that
# law finish — and it is listed here so its absence is a debt rather than an
# oversight.
#
# The frozen worker surface (src/, wrangler) is deliberately NOT built here.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # canon judges, the harness only drives. Every verdict printed is a law's
  # own atom, and the runner exits nonzero iff some law answered F
  # (tail.part.js: `process.exit(out[1] === "T" ? 0 : 1)`).
  wall:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # java and dotnet are preinstalled on windows-latest.
      - name: js host
        shell: bash
        working-directory: tools/js-runner
        run: bun run build:test && bun test
      # compiles Arest, Reader, Program, CasesTest AND Gui — the Swing
      # container is gated here or nowhere
      - name: java host and its GUI
        shell: bash
        run: sh tools/java-runner/test.sh
      - name: cs host
        shell: bash
        working-directory: tools/cs-runner-tests
        run: dotnet test --nologo -v q
      # the iFactr container. TWO of its inputs live OUTSIDE this repo: the
      # references are DISTRIBUTION DLLs from the sibling iFactr-WPF repo, and
      # ComposeCanon splices an app's checked carriers from ../apps/<app>/.check
      # — and apps is a set of repos, one .git each. A CI checkout has neither,
      # so this SKIPS and says so; a skip is never read as a pass.
      #
      # Its third carrier is a `journal`, and the csproj makes a missing one a
      # BUILD ERROR. The journal is being retired (the js host already proves
      # durability through store.db and never reads one), so this container
      # stops building the day that lands. That is the port this station owes:
      # Boot.cs folds the journal where the js host loads the tables, and its
      # store:append registration writes bytes where emitToDb writes rows.
      - name: wpf container
        shell: bash
        run: |
          if [ -d ../iFactr-WPF ] && [ -d ../apps/tasks/.check ]; then
            dotnet build tools/wpf-runner -v q --nologo
          else
            echo "SKIPPED: needs iFactr-WPF and apps/tasks/.check beside this repo"
          fi
