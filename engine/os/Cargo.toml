# engine/os — the AREST 0.9.0 operating-system target, FRESH (2026-07-08,
# Samuel's spec): the 0.9.0 engine hosted on bare UEFI firmware. The
# pre-0.9.0 kernel (crates/arest-kernel, removed in the serving swap
# c2902a64) is the reference tree for target quirks — the soft-SIMD
# build pin (d65bdb43), the OVMF harness mechanics, the profile split —
# but no code is resurrected wholesale; the engine core this crate
# hosts is the 0.9.0 one.
#
# Three targets, cumulative:
#   server — no repl, no UI: the store + verb table served over the
#            wire (the whitepaper's engine surface, headless)
#   mini   — + text console (no Slint)
#   full   — + Slint over the UEFI framebuffer realizing the SAME
#            canon view trees the desktops render (uilayout is already
#            in-language: engine/rust/src/uilayout.rs)
#
# Build:  cargo +nightly build --target x86_64-unknown-uefi
# Smoke:  ..\..\scripts\boot-os-qemu.ps1 -Smoke

[package]
name = "arest-os"
version = "0.1.0"
edition = "2021"
description = "AREST 0.9.0 on bare UEFI"
license = "AGPL-3.0-or-later"

[features]
default = ["server"]
server = []
mini = ["server"]
full = ["mini", "dep:slint"]

[dependencies]
# CANON, THROUGH THE SAME MU EVERY OTHER HOST USES. This was
# `arest = { path = "../rust", features = ["worker"] }` - a second
# engine, 19,664 lines, serving a verb table over a JSON store image.
# It went with the fat hosts on 2026-08-29 and the path dangled, so
# this crate had not built since. Pointing it at tools/rust-host is
# not one dependency swapped for another: that crate IS the thin mu,
# canon and the carriers arrive as SOURCE through its chunker, and
# rustc compiles the same bytes bun executes. There is no store
# artifact to load and no verb table to serve - the OS asks canon
# `main` an address, which is the whole of a fact-based system: an
# operation reaches an entity, and the model decides whether it may.
arest-host = { path = "../../tools/rust-host" }
# firmware protocol access (SNP for the wire) ALONGSIDE std: no
# panic_handler / global_allocator / logger features — std provides
# those lang items on this target (their overlap was the E0152)
uefi = { version = "0.33", default-features = false, features = ["alloc"] }
# the TCP stack over the SNP device: the verb table goes over the wire
# without an OS network layer — smoltcp IS the network layer
smoltcp = { version = "0.11", default-features = false, features = [
    "medium-ethernet", "proto-ipv4", "socket-tcp", "alloc",
] }
# the full target's renderer: Slint's software renderer paints into a
# CPU pixel buffer we blt to the GOP surface — the MCU (no_std) recipe
# even though the target has std (no windowing system exists to bind)
slint = { version = "1.8", optional = true, default-features = false, features = [
    "compat-1-2", "renderer-software", "unsafe-single-threaded", "libm",
] }

[build-dependencies]
# compiles ui/*.slint with glyphs EMBEDDED for the software renderer
# (rasterized on the build host) — text on bare firmware needs no
# font machinery at runtime
slint-build = "1.8"

# Canon is one enormous include!d expression and rustc's per-body cost is
# quadratic in source length, so a full release build does not finish - the
# measurement tools/rust-host records, and this crate carries the whole of it
# through arest-host.
#
# opt-level 0 and no debuginfo, which is a DIFFERENT choice from
# tools/rust-host's dev profile (opt-level 1) and made for a different reason.
# That host is benchmarked against three JIT'd runtimes, so an unoptimized
# build there is not a fair comparison. Nothing here is being timed against
# anything: what matters is that the image links at all, and codegen over
# ~1900 canon elements plus debuginfo is where the wall-clock goes. DEF calls
# execute once, at load, so optimizing their bodies buys nothing either way.
[profile.dev]
opt-level = 0
debug = false

[profile.release]
lto = true
opt-level = "z"
