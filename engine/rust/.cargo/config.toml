# the wasm target needs a real stack: the Scott reduction recurses
# deep (the python host runs at a 1M recursion limit; wasm's default
# ~1 MB shadow stack overflows on tasks-scale handler evaluation —
# the local write smoke's out-of-bounds). 32 MB matches the native
# thread budget.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=33554432"]

# The SAME deep recursion overflows native TEST threads, which spawn at
# Rust's 2 MB default rather than the main thread's budget — so `cargo test`
# died with STATUS_STACK_OVERFLOW (0xc00000fd) in three theta_arms_tests
# (natjoin_known_answer_and_order, natjoin_edge_operands_match_interpreted,
# atom_arms_match_interpreted_on_random_and_malformed_inputs) while the
# faststore and uilayout tests passed. It is a stack budget, not a defect:
# with a real stack all 14 pass in 1.0s. This is the native counterpart of
# the wasm flag above and of conftest.py's setrecursionlimit(1_000_000) —
# the same reduction, the same depth, three hosts.
[env]
RUST_MIN_STACK = "33554432"
